name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  awdl-tests:
    name: Protocol and RX timing regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run protocol and actual RX timer tests
        run: |
          c++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -g tests/awdl_frame_tests.cpp -o /tmp/awdl-tests
          /tmp/awdl-tests
          c++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -g tests/awdl_peer_tests.cpp -o /tmp/awdl-peer-tests
          /tmp/awdl-peer-tests
          c++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -g tests/iwx_rx_timing_tests.cpp -o /tmp/iwx-rx-tests
          /tmp/iwx-rx-tests
          python3 tests/extract_iwx_rx_timers.py /tmp/iwx_rx_timer_functions.inc
          c++ -std=c++14 -Wall -Wextra -Werror -Wno-unused-parameter \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g -I/tmp \
            tests/iwx_rx_timer_integration.cpp -o /tmp/iwx-rx-integration
          /tmp/iwx-rx-integration
          c++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -g tests/hybrid_traffic_tests.cpp -o /tmp/hybrid-tests
          /tmp/hybrid-tests
  build:
    name: ${{ matrix.platform }} (${{ matrix.configuration }})
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        platform: [Sequoia]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Build AirportItlwm for ${{ matrix.platform }}
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p logs
          xcodebuild -project itlwm.xcodeproj -scheme "AirportItlwm-$PLATFORM" \
            -configuration "$CONFIGURATION" -jobs 3 ARCHS=x86_64 \
            SYMROOT="$PWD/build/products" OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO GIT_COMMIT="_$(git rev-parse --short HEAD)" \
            build > "logs/AirportItlwm-$PLATFORM.log" 2>&1 || { tail -100 "logs/AirportItlwm-$PLATFORM.log"; exit 1; }
      - name: Package kernel extension
        env:
          CONFIGURATION: ${{ matrix.configuration }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          products="$PWD/build/products/$CONFIGURATION"
          version=$(awk '/MODULE_VERSION =/ {gsub(/;/, "", $3); print $3; exit}' itlwm.xcodeproj/project.pbxproj)
          short_sha=$(git rev-parse --short HEAD)
          configuration=$(printf '%s' "$CONFIGURATION" | tr '[:lower:]' '[:upper:]')
          suffix="v$version-$configuration-alpha-$short_sha"
          ditto -c -k --keepParent "$products/$PLATFORM/AirportItlwm.kext" "artifacts/AirportItlwm-$PLATFORM-$suffix.zip"
      - name: Build and check reversible Ethernet service setup
        run: |
          clang -fobjc-arc -Wall -Wextra -mmacosx-version-min=15.0 \
            -framework Foundation -framework SystemConfiguration -framework IOKit \
            tools/hybrid-network.m -o artifacts/hybrid-network
          artifacts/hybrid-network --self-test
          codesign --force --sign - artifacts/hybrid-network
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-network-${{ matrix.configuration }}
          path: artifacts/hybrid-network
      - uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-${{ matrix.platform }}-${{ matrix.configuration }}
          path: artifacts/AirportItlwm-${{ matrix.platform }}-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ matrix.platform }}-${{ matrix.configuration }}
          path: logs

  prerelease:
    name: Publish development build
    needs: [build, awdl-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/download-artifact@v4
        with:
          pattern: AirportItlwm-*
          path: artifacts
          merge-multiple: true
      - name: Publish alpha artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk '/MODULE_VERSION =/ {gsub(/;/, "", $3); print $3; exit}' itlwm.xcodeproj/project.pbxproj)
          tag="v$version-alpha"
          printf '%s\n\n' 'Experimental AX211 development build. iwx RX BlockAck timer restart and deadline repairs, plus AWDL receive observation. Physical throughput improvement is unverified; AirDrop, WPA3-only and Apple Watch unlock are not implemented or hardware-qualified. Keep a working EFI backup.' > ReleaseNotes.md
          git log -5 --format='- %h %s' >> ReleaseNotes.md
          if gh release view "$tag" --json isPrerelease > current-release.json 2>/dev/null; then
            # Never replace a stable release with development artifacts.
            jq -e '.isPrerelease == true' current-release.json > /dev/null
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$tag" --prerelease --notes-file ReleaseNotes.md
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "$tag" --notes-file ReleaseNotes.md
          fi
          gh release upload "$tag" artifacts/AirportItlwm-*.zip --clobber

          # Remove obsolete assets only after the replacement set has uploaded.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '.assets[] | [.id, .name] | @tsv' > release-assets.tsv
          while IFS=$'\t' read -r asset_id asset_name; do
            if [[ ! -f "artifacts/$asset_name" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done < release-assets.tsv

          # Keep exactly one prerelease; stable releases are retained.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.prerelease and (.draft | not)) | .tag_name' > prereleases.txt
          while IFS= read -r old_tag; do
            if [[ "$old_tag" != "$tag" ]]; then
              gh release delete "$old_tag" --yes --cleanup-tag
            fi
          done < prereleases.txt
